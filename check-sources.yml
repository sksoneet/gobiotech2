name: Check institute sources
on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 03:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/check_sources.py
      - name: Save baselines and report
        run: |
          git config user.name "gobiotech-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots reports
          git diff --cached --quiet || git commit -m "Source check $(date +%F)"
          git push
      - name: Open a review issue if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python -c "import json;print(len(json.load(open('reports/review_queue.json'))))")" != "0" ]; then
            gh issue create --title "Institute data needs review $(date +%F)" --body-file "reports/changes-$(date +%F).md"
          fi
